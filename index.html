<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gautam Gaming Zone</title>

<style>
body {
  background: #090919;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 15px;
}
h1 { color: #00eaff; }
.card {
  background: #202044;
  padding: 25px;
  margin: 20px auto;
  border-radius: 15px;
  max-width: 380px;
}
button {
  background: #00eaff;
  border: 0;
  padding: 13px 20px;
  border-radius: 10px;
  font-weight: bold;
  margin: 8px;
}
</style>
</head>

<body>

<h1>🎮 Gautam Gaming Zone</h1>
<p>Welcome Gamers!</p>

<div class="card">
<h2>⚡ Tap Challenge</h2>
<h1 id="score">0</h1>
<button onclick="tap()">TAP HERE</button>
</div>

<div class="card">
<h2>🔢 Number Guess Game</h2>
<input id="guess" type="number" min="1" max="10">
<button onclick="checkGuess()">CHECK</button>
<p id="answer"></p>
</div>

<div class="card">
<h2>✊ Rock Paper Scissors</h2>
<button onclick="play('Rock')">Rock</button>
<button onclick="play('Paper')">Paper</button>
<button onclick="play('Scissors')">Scissors</button>
<p id="result"></p>
</div>

<script>
let score = 0;

function tap() {
  score++;
  document.getElementById("score").innerText = score;
}

let number = Math.floor(Math.random()*10)+1;

function checkGuess() {
  let g = Number(document.getElementById("guess").value);

  if(g === number) {
    document.getElementById("answer").innerText =
    "🎉 Correct! You Win!";
    number = Math.floor(Math.random()*10)+1;
  } else {
    document.getElementById("answer").innerText =
    "Try Again!";
  }
}

function play(user) {
  let choices = ["Rock","Paper","Scissors"];
  let computer = choices[Math.floor(Math.random()*3)];

  let result = "Computer: " + computer + " | ";

  if(user === computer) result += "Draw!";
  else if(
    (user==="Rock" && computer==="Scissors") ||
    (user==="Paper" && computer==="Rock") ||
    (user==="Scissors" && computer==="Paper")
  ) result += "You Win!";
  else result += "Computer Wins!";

  document.getElementById("result").innerText = result;
}
</script>

</body>
  </html>
