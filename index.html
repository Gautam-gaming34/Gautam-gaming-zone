<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gautam Gaming Zone</title>
<style>
body {
  background:#090919;
  color:white;
  text-align:center;
  font-family:Arial;
  padding:20px;
}
h1 {color:#00eaff;}
.card {
  background:#202044;
  padding:25px;
  border-radius:15px;
  margin:30px auto;
  max-width:350px;
}
button {
  background:#00eaff;
  padding:15px;
  border:0;
  border-radius:10px;
  font-weight:bold;
}
</style>
</head>
<body>

<h1>🎮 Gautam Gaming Zone</h1>
<p>Welcome Gamers!</p>

<div class="card">
<h2>Tap Challenge</h2>
<h1 id="score">0</h1>
<button onclick="play()">PLAY GAME</button>
</div>

<script>
let score=0;
function play() {
 score++;
 document.getElementById("score").innerText=score;
}
</script>

</body>
</html>
